name: Update README (Auto)

on:
  schedule:
    - cron: "0 1 * * *" # Chạy lúc 1:00 AM hàng ngày
  workflow_dispatch:     # Cho phép chạy thủ công

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Quan trọng để git pull/rebase không bị lỗi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # Tự động cache dependencies để chạy nhanh hơn

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run README updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python "scripts/update_readme.py"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "main"
          git pull --rebase origin "main"
          
          git add "README.md"
          
          # Kiểm tra xem có thay đổi không trước khi commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "chore: auto-update README"
          
          # Sử dụng cơ chế retry nếu bị xung đột (conflict)
          git pull --rebase origin "main"
          git push origin "main"
